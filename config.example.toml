app_id = 123456
installation_id = 12345678
pem_path = "/absolute/path/to/github-app.private-key.pem"
repositories = ["owner/repository"]
mention = "@akashic-review-bot"
bot_login = "akashic-review-bot[bot]"
poll_seconds = 120
checkout_ttl_seconds = 86400
notify_channel = "mobile"
notify_chat_id = "main-chat-id"
# 评审 Session 落在哪个 Akasha 记忆范围；该范围应设为不学习、不召回。
memory_scope = "github-watch"
